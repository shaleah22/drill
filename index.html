<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFCFE; --grid:#E4EBF6; --ink:#17223B; --muted:#5B6781;
    --line:#C9D3E3; --blue:#2A5BD7; --blue-soft:#E8EFFD;
    --hi:#FFE14D; --good:#1E8F4E; --good-soft:#E3F5EA; --bad:#C8372D; --bad-soft:#FBE9E7;
    --font:"Lexend", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font); color:var(--ink); background:#fff; line-height:1.45;
  }
  button,input{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .screen{display:none;min-height:100%;padding:24px 20px 40px}
  .screen.on{display:block}
  .narrow{max-width:520px;margin:10vh auto 0}
  h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;margin:0 0 .4rem;line-height:1.1}
  p.lead{color:var(--muted);margin:0 0 1.6rem;font-size:1.05rem}
  label{display:block;font-weight:500;margin-bottom:.4rem}
  .field{display:flex;gap:10px}
  .text{flex:1;min-width:0;font-size:1.4rem;padding:.6rem .8rem;border:2px solid var(--ink);border-radius:10px;background:#fff}
  .btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:.6rem 1.2rem;font-size:1.1rem;font-weight:700;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn:disabled{opacity:.5;cursor:default}
  .msg{min-height:1.6em;margin-top:.8rem;font-weight:500}
  .msg.err{color:var(--bad)}
  .note{margin-top:1.4rem;padding:.8rem 1rem;border-left:4px solid var(--hi);background:#fff;color:var(--muted);font-size:.95rem}

  /* confirm */
  .hello{font-size:2rem;font-weight:800;margin:0 0 .3rem}
  .facts{display:flex;gap:28px;margin:1.2rem 0 1.8rem}
  .facts div{font-size:.95rem;color:var(--muted)}
  .facts b{display:block;font-size:1.8rem;color:var(--ink);font-weight:800}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .gradepick{display:flex;gap:8px;margin:.4rem 0 1.4rem}

  /* drill */
  .bar{margin:0 0 24px;padding-bottom:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .who{font-weight:700;font-size:1.1rem}
  .level{font-size:1.1rem;font-weight:500;color:var(--muted)}
  .level b{
    font-size:2rem;font-weight:800;color:var(--ink);padding:0 .2em;display:inline-block;
    background:linear-gradient(transparent 45%,var(--hi) 45%,var(--hi) 88%,transparent 88%);
  }
  .level b.pop{animation:pop .35s ease-out}
  @keyframes pop{40%{transform:scale(1.35) rotate(-3deg)}100%{transform:none}}
  .clock{flex:1;min-width:160px;display:flex;align-items:center;gap:10px}
  .track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
  .fill{height:100%;background:var(--ink);width:100%;transition:width .25s linear}
  .clock.low .fill{background:var(--bad)}
  .time{font-variant-numeric:tabular-nums;font-weight:700;min-width:3.2em;text-align:right}
  .saved{font-size:.9rem;font-weight:500;color:var(--muted);min-width:8.5em;text-align:right}
  .saved.ok{color:var(--good)} .saved.warn{color:var(--bad)}

  .card{padding:8px 4px 24px}
  #qimg{display:none;max-width:100%;max-height:45vh;margin:0 0 18px;border-radius:6px}
  #qtext{font-size:1.8rem;font-weight:500;margin-bottom:22px;overflow-x:auto}
  #qtext svg{width:min(100%,720px);max-width:100%;height:auto}
  #qtext table{border-collapse:collapse;margin:.5rem 0;font-size:1.3rem}
  #qtext td,#qtext th{border:1.5px solid var(--ink);padding:.2rem .7rem;text-align:center}
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .choice{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:.8rem 1rem;font-size:1.3rem;cursor:pointer}
  .choice:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
  .choice .k{flex:none;width:1.7em;height:1.7em;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:.8em;font-weight:700;color:var(--muted)}
  .choice.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);cursor:default}
  .choice.right{border-color:var(--good);background:var(--good-soft)}
  .answer-row{display:flex;gap:10px;max-width:640px}
  .answer-row .text.shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #feedback{min-height:1.8em;margin-top:14px;font-weight:700;font-size:1.15rem}
  #feedback.good{color:var(--good)} #feedback.bad{color:var(--bad)}
  #reveal{display:none;margin-top:12px;padding:.8rem 1rem;border-radius:10px;background:#FFF8D6;border:2px dashed #E0B800;font-size:1.05rem}
  #reveal b{font-size:1.25rem}

  /* done */
  .big{font-size:5rem;font-weight:800;line-height:1;margin:.6rem 0;display:inline-block;padding:0 .15em;
    background:linear-gradient(transparent 50%,var(--hi) 50%,var(--hi) 90%,transparent 90%)}
  .summary{color:var(--muted);font-size:1.1rem;margin-bottom:1.4rem}
  .savebox{padding:.9rem 1rem;border-radius:10px;font-weight:700;margin-bottom:1.4rem;border:2px solid}
  .savebox.ok{color:var(--good);background:var(--good-soft);border-color:var(--good)}
  .savebox.wait{color:var(--muted);background:#fff;border-color:var(--line)}
  .savebox.warn{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}

  @media (max-width:600px){
    h1{font-size:2rem} #qtext{font-size:1.35rem}
    .saved{min-width:0;text-align:left}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 1. Sign in -->
<section class="screen on" id="s-login">
  <div class="narrow">
    <h1>Math Drill</h1>
    <p class="lead">Two minutes. Every correct answer moves you up a level.</p>
    <label for="username">Your username</label>
    <div class="field">
      <input class="text" id="username" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus>
      <button class="btn" id="go">Next</button>
    </div>
    <div class="msg" id="loginMsg" role="status"></div>
    <div class="note" id="practiceNote" hidden>This copy isn't connected to a Google Sheet yet, so levels won't be saved. Any username works for trying it out.</div>
  </div>
</section>

<!-- 2. Confirm -->
<section class="screen" id="s-confirm">
  <div class="narrow">
    <p class="hello" id="hello"></p>
    <div class="facts">
      <div><b id="cLevel"></b>current level</div>
      <div id="cGradeWrap"><b id="cGrade"></b>grade</div>
      <div id="cWeekWrap"><b id="cWeek"></b>this week</div>
    </div>
    <div id="gradePickWrap" hidden>
      <label>Practice which grade?</label>
      <div class="gradepick" id="gradePick"></div>
    </div>
    <div class="row">
      <button class="btn" id="start">Start the drill</button>
      <button class="btn ghost" id="notMe">That's not me</button>
    </div>
    <div class="msg err" id="confirmMsg"></div>
  </div>
</section>

<!-- 3. Drill -->
<section class="screen" id="s-drill">
  <div class="bar">
    <span class="who" id="who"></span>
    <span class="level">Level <b id="lvl">1</b></span>
    <div class="clock" id="clock"><div class="track"><div class="fill" id="fill"></div></div><span class="time" id="time">2:00</span></div>
    <span class="saved" id="saved" role="status"></span>
  </div>
  <div class="card">
    <img id="qimg" alt="Picture for this question" referrerpolicy="no-referrer">
    <div id="qtext"></div>
    <div id="answerArea"></div>
    <div id="feedback" role="status"></div>
    <div id="reveal"></div>
  </div>
</section>

<!-- 4. Done -->
<section class="screen" id="s-done">
  <div class="narrow">
    <h1>Time's up!</h1>
    <div>You reached level</div>
    <div class="big" id="dLevel"></div>
    <div class="summary" id="dSummary"></div>
    <div class="savebox wait" id="dSave">Saving your level…</div>
    <div class="row">
      <button class="btn" id="again" hidden>Play another round</button>
      <button class="btn ghost" id="retry" hidden>Try saving again</button>
    </div>
  </div>
</section>

<script>
/* =========================================================
   SETUP: paste your Google Apps Script web app URL here.
   Leave it empty to run in practice mode (nothing is saved).
   ========================================================= */
const SCRIPT_URL = "";

/* Used only if the sheet doesn't send its own settings */
const DEFAULTS = { drillSeconds: 120, revealSeconds: 10, allowReplay: true };

/* ---------- data ---------- */
const BANK = JSON.parse(document.getElementById("bank").textContent);
const $ = id => document.getElementById(id);
window.addEventListener("contextmenu", e => e.preventDefault());

const S = {
  username:"", name:"", grade:"", units:null, settings:{...DEFAULTS},
  level:1, startLevel:1, lastSaved:1, correct:0, revealedCount:0,
  sessionId:"", pool:[], idx:0, q:null, revealed:false, locked:false, missed:false, missedCount:0,
  deadline:0, tick:null, revealTimer:null, saveTimer:null, retryTimer:null,
  saving:false, retryDelay:2000, ended:false, broken:[]
};
const practice = !SCRIPT_URL;
const previewUnits = new URLSearchParams(location.search).get("units");

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); }
function cleanName(s){ return String(s).toLowerCase().replace(/\s+/g,""); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- 1. sign in ---------- */
if(practice) $("practiceNote").hidden = false;
$("go").onclick = lookUp;
$("username").addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); lookUp(); } });

async function lookUp(){
  const u = cleanName($("username").value);
  $("username").value = u;
  const msg = $("loginMsg"); msg.className = "msg";
  if(!u){ msg.textContent = "Type your username first."; msg.classList.add("err"); return; }
  S.username = u;
  if(practice){
    Object.assign(S,{name:u, grade:"", level:1, units:null});
    return showConfirm();
  }
  msg.textContent = "Looking you up…"; $("go").disabled = true;
  try{
    const r = await fetch(`${SCRIPT_URL}?action=lookup&username=${encodeURIComponent(u)}`);
    const data = await r.json();
    if(!data.ok){
      msg.classList.add("err");
      msg.textContent = data.error==="not_found"
        ? `No student named "${u}" is on the list. Check the spelling, or ask your teacher.`
        : (data.message || "Something went wrong looking you up. Try again.");
      return;
    }
    Object.assign(S,{ name:data.name||u, grade:data.grade||"", level:Number(data.level)||1, thisWeek:Number(data.thisWeek)||0,
      units:data.units&&data.units.length?data.units:null,
      settings:{...DEFAULTS, ...(data.settings||{})} });
    msg.textContent = "";
    showConfirm();
  }catch(err){
    console.error(err);
    msg.classList.add("err");
    msg.textContent = "Couldn't reach the gradebook. Check your internet connection and press Next again.";
  }finally{ $("go").disabled = false; }
}

/* ---------- 2. confirm ---------- */
function showConfirm(){
  $("hello").textContent = `Hi, ${S.name}!`;
  $("cLevel").textContent = S.level;
  $("cGrade").textContent = parseInt(S.grade,10) ? parseInt(S.grade,10)+"th" : "–";
  $("cGradeWrap").hidden = practice;
  $("cWeek").textContent = S.thisWeek || 0;
  $("cWeekWrap").hidden = practice;
  $("gradePickWrap").hidden = !practice;
  if(practice){
    const pick = $("gradePick"); pick.innerHTML = "";
    [["6","6th"],["7","7th"],["8","8th"],["","All"]].forEach(([g,label])=>{
      const b = document.createElement("button");
      b.className = "btn ghost"; b.textContent = label;
      b.onclick = () => { S.grade = g; [...pick.children].forEach(c=>c.style.background=""); b.style.background="var(--hi)"; };
      pick.appendChild(b);
    });
    pick.lastChild.click();
  }
  $("confirmMsg").textContent = "";
  show("s-confirm");
  $("start").focus();
}
$("notMe").onclick = () => { $("username").value=""; show("s-login"); $("username").focus(); };
$("start").onclick = startDrill;

function buildPool(){
  let units = S.units;
  if(previewUnits) units = previewUnits==="all" ? null : previewUnits.split(",");
  else if(practice && S.grade) units = BANK.units.filter(u=>u.grades.includes(Number(S.grade))).map(u=>u.id);
  const set = units ? new Set(units) : null;
  let pool = BANK.questions.filter(q => !set || [].concat(q.u).some(u => set.has(u)));
  if(!pool.length) pool = BANK.questions.slice();
  return shuffle(pool);
}

/* ---------- 3. drill ---------- */
function startDrill(){
  S.pool = buildPool(); S.idx = 0;
  S.startLevel = S.level; S.lastSaved = S.level;
  S.correct = 0; S.revealedCount = 0; S.missedCount = 0; S.ended = false; S.broken = [];
  S.sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  $("who").textContent = S.name;
  $("lvl").textContent = S.level;
  setSaved(practice ? "Practice mode" : "", "");
  show("s-drill");
  S.deadline = Date.now() + S.settings.drillSeconds*1000;
  clearInterval(S.tick); S.tick = setInterval(updateClock, 250); updateClock();
  loadQuestion();
}

function updateClock(){
  const left = Math.max(0, S.deadline - Date.now());
  const s = Math.ceil(left/1000);
  $("time").textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  $("fill").style.width = (100*left/(S.settings.drillSeconds*1000)) + "%";
  $("clock").classList.toggle("low", s<=15);
  if(left<=0) endDrill();
}

const FAILED_IMAGES = new Set();   // pictures that wouldn't load on this computer
const IMAGE_WAIT_MS = 6000;

function loadQuestion(){
  clearTimeout(S.revealTimer); clearTimeout(S.imgTimer);
  // skip questions whose picture already failed on this computer
  let guard = 0;
  while(S.pool[S.idx % S.pool.length].img && FAILED_IMAGES.has(S.pool[S.idx % S.pool.length].img) && guard++ < S.pool.length) S.idx++;
  const q = S.pool[S.idx % S.pool.length];
  S.q = q; S.revealed = false; S.locked = false; S.missed = false;
  $("feedback").textContent = ""; $("feedback").className = "";
  $("reveal").style.display = "none";
  $("qtext").innerHTML = q.q;

  const area = $("answerArea"); area.innerHTML = "";
  if(q.o || q.lc) renderChoices(q, area); else renderInput(area);

  const img = $("qimg");
  img.onload = img.onerror = null;
  if(q.img){
    // a picture question stays hidden until its picture is on screen
    img.style.display = "none";
    $("qtext").style.visibility = "hidden"; area.style.visibility = "hidden";
    $("feedback").textContent = "Loading picture…";
    const fail = () => {
      if(S.q!==q) return;
      FAILED_IMAGES.add(q.img);
      if(!S.broken.some(b=>b.url===q.img)) S.broken.push({url:q.img, question:q.q.replace(/<[^>]+>/g," ").slice(0,120)});
      $("qtext").style.visibility = area.style.visibility = "";
      nextQuestion();   // no penalty
    };
    img.onload = () => {
      if(S.q!==q) return;
      clearTimeout(S.imgTimer);
      img.style.display = "block";
      $("qtext").style.visibility = area.style.visibility = "";
      $("feedback").textContent = "";
      const inp = $("ans"); if(inp) inp.focus();
      S.revealTimer = setTimeout(revealAnswer, S.settings.revealSeconds*1000);
    };
    img.onerror = fail;
    S.imgTimer = setTimeout(fail, IMAGE_WAIT_MS);
    img.src = q.img;
  }else{
    img.removeAttribute("src"); img.style.display = "none";
    $("qtext").style.visibility = area.style.visibility = "";
    S.revealTimer = setTimeout(revealAnswer, S.settings.revealSeconds*1000);
  }

  // preload the next picture
  const nxt = S.pool[(S.idx+1) % S.pool.length];
  if(nxt && nxt.img && !FAILED_IMAGES.has(nxt.img)){ const p = new Image(); p.referrerPolicy = "no-referrer"; p.src = nxt.img; }
}

function renderChoices(q, area){
  const wrap = document.createElement("div"); wrap.className = "choices";
  let items;
  if(q.lc){ items = q.lc.map(([k,t]) => ({key:k, html:t, value:k})); }
  else{
    const fixedOrder = q.o.some(o=>/\b(above|both|none|neither)\b/i.test(o));
    const opts = fixedOrder ? q.o.slice() : shuffle(q.o.slice());
    items = opts.map((o,i) => ({key:String(i+1), html:o, value:o}));
  }
  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "choice"; b.dataset.key = it.key.toLowerCase();
    b.innerHTML = `<span class="k">${esc(it.key)}</span><span>${it.html}</span>`;
    b.onclick = () => submit(it.value, b);
    wrap.appendChild(b);
  });
  area.appendChild(wrap);
}

function renderInput(area){
  area.innerHTML = `<div class="answer-row"><input class="text" id="ans" autocomplete="off" spellcheck="false" aria-label="Your answer"><button class="btn" id="check">Check</button></div>`;
  const inp = $("ans");
  $("check").onclick = () => submit(inp.value);
  inp.addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); submit(inp.value); } });
  // move on by itself once the typed answer is right (short pause so "12" isn't cut off at "1")
  let wait;
  inp.addEventListener("input", () => {
    clearTimeout(wait);
    const q = S.q;
    wait = setTimeout(() => { if(S.q===q && matches(inp.value, q.a)) submit(inp.value); }, 350);
  });
  setTimeout(()=>inp.focus(), 0);
}

// number keys / letter keys pick a choice
document.addEventListener("keydown", e => {
  if(!$("s-drill").classList.contains("on") || e.target.tagName==="INPUT" || e.ctrlKey || e.metaKey) return;
  const b = document.querySelector(`.choice[data-key="${CSS.escape(e.key.toLowerCase())}"]`);
  if(b && !b.disabled){ e.preventDefault(); b.click(); }
});

function norm(s){
  return String(s).toLowerCase().replace(/[\s\u00a0]+/g,"")
    .replace(/[\u2212\u2013\u2014]/g,"-").replace(/≤/g,"<=").replace(/≥/g,">=").replace(/[$%]/g,"");
}
function isNum(s){ return /^-?(\d{1,3}(,\d{3})+|\d*)(\.\d+)?$/.test(s) && /\d/.test(s); }
function matches(user, answer){
  const u = norm(user), a = norm(answer);
  if(!u) return false;
  if(u===a) return true;
  if(isNum(u) && isNum(a) && parseFloat(u.replace(/,/g,""))===parseFloat(a.replace(/,/g,""))) return true;
  const ua = u.match(/^[a-z]=(.+)$/), aa = a.match(/^[a-z]=(.+)$/);
  if(aa && aa[1]===u) return true;          // typed "5" for "x=5"
  if(ua && ua[1]===a) return true;          // typed "x=5" for "5"
  return false;
}

function submit(value, btn){
  if(S.locked || S.ended || $("answerArea").style.visibility==="hidden") return;
  const ok = (S.q.o || S.q.lc) ? value===S.q.a : matches(value, S.q.a);
  const fb = $("feedback");
  if(ok){
    S.locked = true;
    clearTimeout(S.revealTimer);
    if(btn) btn.classList.add("right");
    if(S.revealed || S.missed){
      if(S.revealed) S.revealedCount++; else S.missedCount++;
      fb.textContent = "Got it. On to the next one.";
    }else{
      S.level++; S.correct++;
      const l = $("lvl"); l.textContent = S.level;
      l.classList.remove("pop"); void l.offsetWidth; l.classList.add("pop");
      fb.textContent = "Correct!";
      scheduleSave();
    }
    fb.className = "good";
    setTimeout(nextQuestion, (S.revealed || S.missed) ? 500 : 300);
  }else{
    fb.className = "bad";
    if(btn){
      // multiple choice: one wrong pick and this question no longer earns a level
      btn.classList.add("wrong"); btn.disabled = true;
      S.missed = true;
      fb.textContent = S.revealed ? "Not quite. Pick the answer shown below."
        : "Not quite. This one won't count now, but pick the right answer to move on.";
    }else{ fb.textContent = "Not quite. Try again."; }
    if(!btn){
      const inp=$("ans"); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.select();
    }
  }
}

function nextQuestion(){ if(S.ended) return; S.idx++; loadQuestion(); }

function revealAnswer(){
  if(S.ended) return;
  S.revealed = true;
  const how = (S.q.o || S.q.lc) ? "Pick it" : "Type it";
  const shown = S.q.lc ? `${S.q.a}: ${S.q.lc.find(x=>x[0]===S.q.a)[1]}` : S.q.a;
  const r = $("reveal");
  r.innerHTML = `The answer is <b>${shown}</b>. ${how} to move on.` + (S.missed ? "" : " This one won't count toward your level.");
  r.style.display = "block";
}

/* ---------- saving ---------- */
function setSaved(text, cls){ const el=$("saved"); el.textContent=text; el.className="saved "+(cls||""); }

function payload(final){
  return { action:"save", username:S.username, level:S.level, startLevel:S.startLevel,
    correct:S.correct, revealed:S.revealedCount, missed:S.missedCount, sessionId:S.sessionId, final:!!final, broken:S.broken };
}

function scheduleSave(){
  if(practice) return;
  clearTimeout(S.saveTimer);
  // save quickly after every few levels, otherwise a few seconds after the last correct answer
  if(S.level - S.lastSaved >= 5) saveNow();
  else S.saveTimer = setTimeout(saveNow, 4000);
}

async function saveNow(final){
  if(practice) return;
  clearTimeout(S.saveTimer); clearTimeout(S.retryTimer);
  if(S.saving){ S.saveTimer = setTimeout(()=>saveNow(final), 800); return; }
  if(S.level <= S.lastSaved && !final){ setSaved("Saved ✓","ok"); return; }
  S.saving = true;
  const levelSent = S.level, brokenSent = S.broken.length;
  setSaved("Saving…","");
  updateDoneSave("wait","Saving your level…");
  try{
    // text/plain body keeps this a "simple" request so we can read Google's reply
    const r = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify(payload(final)) });
    const data = await r.json();
    if(!data.ok) throw new Error(data.message || "Save rejected");
    S.lastSaved = Math.max(S.lastSaved, levelSent);
    S.broken.splice(0, brokenSent);
    S.retryDelay = 2000;
    if(S.level > S.lastSaved && !S.ended) scheduleSave();
    else{
      setSaved("Saved ✓","ok");
      updateDoneSave("ok", `Saved. Your teacher can see level ${S.lastSaved}.`);
    }
  }catch(err){
    console.error(err);
    setSaved("Not saved yet, retrying","warn");
    updateDoneSave("warn","Your level isn't saved yet. Keep this page open; it will keep trying.");
    $("retry").hidden = !S.ended;
    S.retryTimer = setTimeout(()=>saveNow(final), S.retryDelay);
    S.retryDelay = Math.min(S.retryDelay*2, 30000);
  }finally{ S.saving = false; }
}

// last-chance save if the tab is closed or hidden
function beaconSave(){
  if(practice || !S.sessionId || S.level <= S.lastSaved) return;
  try{ navigator.sendBeacon(SCRIPT_URL, new Blob([JSON.stringify(payload(S.ended))], {type:"text/plain"})); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="hidden") beaconSave(); });
window.addEventListener("pagehide", beaconSave);
window.addEventListener("beforeunload", e => {
  if(!practice && S.sessionId && S.level > S.lastSaved){ beaconSave(); e.preventDefault(); e.returnValue = ""; }
});

/* ---------- 4. done ---------- */
function updateDoneSave(cls, text){
  if(!S.ended) return;
  const b = $("dSave"); b.className = "savebox "+cls; b.textContent = text;
  if(cls==="ok") $("retry").hidden = true;
}

function endDrill(){
  if(S.ended) return;
  S.ended = true;
  clearInterval(S.tick); clearTimeout(S.revealTimer); clearTimeout(S.saveTimer); clearTimeout(S.imgTimer);
  $("dLevel").textContent = S.level;
  const gained = S.level - S.startLevel;
  $("dSummary").textContent = (gained===1 ? "Up 1 level this round." : `Up ${gained} levels this round.`)
    + (S.missedCount ? ` ${S.missedCount} multiple-choice miss${S.missedCount>1?"es":""} didn't count.` : "")
    + (S.revealedCount ? ` ${S.revealedCount} shown answer${S.revealedCount>1?"s":""} didn't count.` : "")
    + (practice ? "" : ` That makes ${S.thisWeek + S.correct} correct this week.`);
  S.thisWeek += S.correct;
  $("again").hidden = !S.settings.allowReplay;
  $("retry").hidden = true;
  show("s-done");
  if(practice){
    const b=$("dSave"); b.className="savebox wait"; b.textContent="Practice mode: this level wasn't saved.";
  }else saveNow(true);
}
$("retry").onclick = () => { S.retryDelay = 2000; saveNow(true); };
$("again").onclick = () => {
  if(!practice && S.level > S.lastSaved){ updateDoneSave("warn","Wait until your level is saved before starting another round."); return; }
  startDrill();
};
</script>
</body>
